<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taylise Ink | Art Studio</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fade .3s ease;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- ================================================= -->
    <!-- LANDING PAGE -->
    <!-- ================================================= -->

    <div id="landing-page">

        <nav class="fixed top-0 w-full z-50 bg-black/90 border-b border-zinc-800">
            <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">

                <div class="flex items-center gap-3">
                    <img src="https://drive.google.com/thumbnail?id=1kUv0f01_2-PfOs3TxIccvM33UVM5UIHz&sz=w800"
                        class="w-10 h-10 rounded-full object-cover border border-pink-600">

                    <span class="text-xl font-black tracking-widest uppercase">
                        Taylise Ink
                    </span>
                </div>

                <button onclick="switchView('login')"
                    class="bg-pink-600 hover:bg-pink-700 transition px-5 py-2 rounded-full font-bold">
                    Área da Artista
                </button>

            </div>
        </nav>

        <section class="min-h-screen flex items-center justify-center text-center px-6">

            <div class="max-w-3xl">

                <h1 class="text-6xl font-black mb-6">
                    Taylise Ink
                </h1>

                <p class="text-zinc-400 text-xl mb-10">
                    Blackwork • Fine Line • Arte Exclusiva
                </p>

                <a href="https://wa.me/5551981749825"
                    class="bg-pink-600 hover:bg-pink-700 transition px-8 py-4 rounded-full text-lg font-bold inline-block">
                    Fazer orçamento
                </a>

            </div>

        </section>

    </div>

    <!-- ================================================= -->
    <!-- LOGIN -->
    <!-- ================================================= -->

    <div id="login-screen"
        class="hidden min-h-screen bg-black flex items-center justify-center p-6 fade-in">

        <div class="w-full max-w-md bg-zinc-950 border border-zinc-800 rounded-2xl p-8">

            <div class="text-center mb-8">

                <img src="https://drive.google.com/thumbnail?id=1kUv0f01_2-PfOs3TxIccvM33UVM5UIHz&sz=w800"
                    class="w-20 h-20 rounded-full mx-auto mb-4 object-cover border-2 border-pink-600">

                <h2 class="text-3xl font-bold">
                    Área da Artista
                </h2>

                <p class="text-zinc-500 mt-2">
                    Login administrativo
                </p>

            </div>

            <!-- LOGIN FORM -->

            <form id="login-form" class="space-y-5">

                <div>

                    <label class="block mb-2 text-zinc-400">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password-input"
                        placeholder="Digite a senha"
                        class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-4 py-3 text-white outline-none focus:border-pink-500">

                    <p id="login-error"
                        class="hidden text-red-500 text-sm mt-2">
                        Senha incorreta.
                    </p>

                </div>

                <button
                    type="submit"
                    class="w-full bg-pink-600 hover:bg-pink-700 transition py-3 rounded-lg font-bold">
                    Entrar
                </button>

                <button
                    type="button"
                    onclick="switchView('landing')"
                    class="w-full text-zinc-500 hover:text-white transition">
                    Voltar
                </button>

            </form>

        </div>

    </div>

    <!-- ================================================= -->
    <!-- ADMIN -->
    <!-- ================================================= -->

    <div id="admin-dashboard"
        class="hidden min-h-screen bg-black text-white fade-in">

        <div class="flex">

            <!-- SIDEBAR -->

            <aside class="w-72 bg-zinc-950 border-r border-zinc-800 min-h-screen p-6">

                <div class="text-center mb-10">

                    <img src="https://drive.google.com/thumbnail?id=1kUv0f01_2-PfOs3TxIccvM33UVM5UIHz&sz=w800"
                        class="w-20 h-20 rounded-full mx-auto mb-4 border-2 border-pink-600 object-cover">

                    <h2 class="text-2xl font-black">
                        TAYLISE INK
                    </h2>

                    <p class="text-zinc-500 text-sm mt-1">
                        Painel Admin
                    </p>

                </div>

                <div class="space-y-3">

                    <button
                        class="w-full bg-pink-600 py-3 rounded-lg font-bold">
                        Dashboard
                    </button>

                    <button
                        class="w-full bg-zinc-900 py-3 rounded-lg">
                        Clientes
                    </button>

                    <button
                        class="w-full bg-zinc-900 py-3 rounded-lg">
                        Agenda
                    </button>

                    <button
                        class="w-full bg-zinc-900 py-3 rounded-lg">
                        Estoque
                    </button>

                </div>

                <button
                    onclick="logout()"
                    class="w-full mt-10 border border-zinc-700 py-3 rounded-lg hover:bg-zinc-900 transition">
                    Sair
                </button>

            </aside>

            <!-- CONTENT -->

            <main class="flex-1 p-10">

                <h1 class="text-5xl font-black mb-4">
                    Bem-vinda, Tay ✨
                </h1>

                <p class="text-zinc-400 mb-10">
                    Seu painel está funcionando corretamente.
                </p>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6">
                        <h3 class="text-zinc-400 mb-2">
                            Clientes
                        </h3>

                        <p class="text-4xl font-black">
                            12
                        </p>
                    </div>

                    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6">
                        <h3 class="text-zinc-400 mb-2">
                            Sessões
                        </h3>

                        <p class="text-4xl font-black">
                            5
                        </p>
                    </div>

                    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6">
                        <h3 class="text-zinc-400 mb-2">
                            Estoque
                        </h3>

                        <p class="text-4xl font-black">
                            OK
                        </p>
                    </div>

                </div>

            </main>

        </div>

    </div>

    <!-- ================================================= -->
    <!-- SCRIPT -->
    <!-- ================================================= -->

    <script>

        // ==========================================
        // ICONS
        // ==========================================

        lucide.createIcons();

        // ==========================================
        // TROCA DE TELAS
        // ==========================================

        function switchView(view) {

            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.add('hidden');

            if (view === 'login') {

                document.getElementById('login-screen').classList.remove('hidden');

            } else if (view === 'admin') {

                document.getElementById('admin-dashboard').classList.remove('hidden');

            } else {

                document.getElementById('landing-page').classList.remove('hidden');

            }

            window.scrollTo(0, 0);

        }

        // ==========================================
        // LOGIN
        // ==========================================

        const loginForm = document.getElementById('login-form');

        loginForm.addEventListener('submit', function (e) {

            e.preventDefault();

            const password = document.getElementById('password-input').value;

            const error = document.getElementById('login-error');

            // SENHA
            if (password === "Taylise2026") {

                error.classList.add('hidden');

                switchView('admin');

            } else {

                error.classList.remove('hidden');

            }

        });

        // ==========================================
        // LOGOUT
        // ==========================================

        function logout() {

            switchView('landing');

            document.getElementById('password-input').value = '';

        }

    </script>

</body>

</html>
